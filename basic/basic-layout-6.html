<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Layout 6</title>
    <link rel="stylesheet" href="../style.css">
    <style>
      #basic-layout-6 {
        display:grid;
        grid-template-rows:200px 100px 400px 160px;
        grid-template-columns: 1fr 3fr 1fr;
        gap: 15px;
      }
      
      header {
        grid-column: 1/3;
      }

      nav {
        grid-column: 1/2;
        grid-row: 2/10;
      }

      main {
        grid-column: 2/3;
        grid-row: 2/10;
      }

      footer {
        grid-column: 3/4;
        grid-row:1/10;
      }


    </style>
  </head>
  <body id="basic-layout-6">
    <header><h1>Basic Layout 6</h1></header>
    <nav><a href="../index.html">Terug naar het overzicht</a></nav>
    <main></main>
    <footer></footer>
  </body>
</html>
