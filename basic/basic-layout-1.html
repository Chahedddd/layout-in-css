<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Layout 1</title>
    <link rel="stylesheet" href="../style.css">
    <style>
     #basic-layout-1 {
      display: grid;
      grid-template-columns: 1fr 4fr;
      grid-template-rows:250px 800px 120px;
      gap: 15px;
     }

     #basic-layout-1 header,
     #basic-layout-1 footer {
      grid-column:1/-1;
     }
    </style>
  </head>
  <body id="basic-layout-1">
    <header><h1>Basic Layout 1</h1></header>
    <nav><a href="../index.html">Terug naar het overzicht</a></nav>
    <main></main>
    <footer></footer>
  </body>
</html>
